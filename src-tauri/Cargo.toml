[package]
name = "app"
version = "0.3.0"
description = "町林市バスアプリ"
authors = ["ANKRED"]
license = ""
repository = "git+https://github.com/Ank-red/Machirun.git"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
device_query = "2.1"
tiny_http = "0.12"
lazy_static = "1.4"
rfd = "0.15"
