<!doctype html>
<html lang="ja">

<head>
  <!-- META -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- OGP -->
  <meta property="og:title" content="{APP_TITLE} Driver">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{APP_HOMEPAGE}">
  <meta property="og:image" content="{APP_HOMEPAGE}/icon.png">
  <meta property="og:site_name" content="{APP_TITLE} Driver">
  <meta property="og:description" content="{APP_DESCRIPTION}">
  <meta property="og:locale" content="ja">
  <!-- フォント -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" crossorigin="anonymous" href="https://fonts.googleapis.com">
  <link rel="preconnect" crossorigin="anonymous" href="https://fonts.gstatic.com">
  <link rel="stylesheet" crossorigin="anonymous"
    href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans+JP:wght@100..900&display=swap">
  <!-- TITLE -->
  <title>{APP_TITLE} Driver - {APP_VERSION}</title>
</head>

<body class="dark">
  <div id="app"></div>
  <script type="module" src="/src/driver.ts"></script>
</body>

</html>
