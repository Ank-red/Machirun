name: デスクトップ版リリース

on:
  workflow_dispatch: # ←これがあることで、GitHub上で「Run workflow」ボタンを押したときだけ手動実行できる
    inputs:
      version_tag:
        description: "リリースするバージョンタグ (例: v1.0.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Linux依存関係のインストール (for Tauri & device_query)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            rpm

      - name: Bunのセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rustのセットアップ
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: パッケージのインストール
        run: bun install

      - name: ビルドとリリース処理
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Machirun Driver v__VERSION__"
          releaseBody: "Windows向けおよびLinux向けのリリースファイルです"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
